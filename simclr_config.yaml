# simclr_config.yaml
# ==============================
# SimCLR + PH Configuration
# ==============================

data_dir: ./data

# backbone: resnet18 | resnet34
backbone: resnet18

batch_size: 128
workers: 2
epochs: 10
log_interval: 5

learning_rate: 0.3
momentum: 0.9
weight_decay: 1e-6
temperature: 0.5

projection_dim: 64
seed: 0

# Choose: baseline | phsim | hybrid
method: baseline

# ==============================
# Training control
# ==============================

train:
  max_steps: 50        # set -1 for full epoch
  warmup_epochs: 0     # baseline warmup even if method=phsim/hybrid

optim:
  lr_min: 1e-3

aug:
  color_strength: 0.5

data:
  subset_size: 5000    # set -1 for full CIFAR

model:
  proj_hidden_dim: 512

# ==============================
# PH configuration
# ==============================

ph:
  reduce_channels: 8
  num_points: 25
  pi_grid: 12
  pi_sigma: 0.15
  birth_min: 0.0
  birth_max: 4.0
  pers_min: 0.0
  pers_max: 4.0
  max_pts_per_dgm: 64
  wasserstein_p: 1
  wasserstein_tau: 1.0
  w_h0: 0.5
  w_h1: 1.0

# ==============================
# Loss configuration
# ==============================

loss:
  # for hybrid (baseline + phsim)
  alpha: 0.9

  # for phsim / hybrid
  teacher_temperature: 0.07   # PH soft-target temperature (sharper targets help)
  student_temperature: 0.5   # rep similarity temperature

  ph_topk: 10                # top-k neighbors for PH targets (0 disables)
  ph_proj_align: 0.05        # similarity alignment weight (0 disables)

# ==============================
# Linear evaluation
# ==============================

finetune_epochs: 10
load_epoch: 10


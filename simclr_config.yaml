# ==============================
# SimCLR + PH Configuration
# ==============================

data_dir: ./data

# backbone: resnet18 | resnet34
backbone: resnet18

batch_size: 128
workers: 2
epochs: 10
log_interval: 5

learning_rate: 0.3
momentum: 0.9
weight_decay: 1e-6
temperature: 0.5

projection_dim: 64
seed: 0

# Choose: baseline | phsim | hybrid
method: baseline

# ==============================
# Training control
# ==============================

train:
  max_steps: 50   # set -1 for full epoch

optim:
  lr_min: 1e-3

aug:
  color_strength: 0.5

data:
  subset_size: 5000   # set -1 for full CIFAR

model:
  proj_hidden_dim: 512

# ==============================
# PH configuration
# ==============================

ph:
  reduce_channels: 8
  num_points: 25
  pi_grid: 12
  pi_sigma: 0.15
  birth_min: 0.0
  birth_max: 4.0
  pers_min: 0.0
  pers_max: 4.0

# ==============================
# Loss configuration
# ==============================

loss:
  # for hybrid (baseline + phsim)
  alpha: 0.9

  # for phsim (PH-guided contrastive)
  # (we reuse these temperature names)
  teacher_temperature: 0.5   # PH soft-target temperature
  student_temperature: 0.5   # rep similarity temperature

# ==============================
# Linear evaluation
# ==============================

finetune_epochs: 10
load_epoch: 10